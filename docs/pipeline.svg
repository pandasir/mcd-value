<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" role="img">
  <title>麦麦点餐参谋 处理流程</title>
  <desc>从麦当劳 MCP 工具取数，经归一化索引、约束求解、多目标打分，输出可直接下单的结构化方案。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="250" fill="#ffffff" stroke="#e3e3e3" stroke-width="1" rx="10"/>

  <g>
    <rect x="30" y="55" width="150" height="62" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
    <text x="105" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#0C447C">麦当劳 MCP</text>
    <text x="105" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">query-meals / nutrition</text>
  </g>

  <line x1="185" y1="86" x2="228" y2="86" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>

  <g>
    <rect x="232" y="55" width="150" height="62" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
    <text x="307" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#3C3489">归一化索引</text>
    <text x="307" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">名称对齐 · 套餐营养建模</text>
  </g>

  <line x1="387" y1="86" x2="430" y2="86" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>

  <g>
    <rect x="434" y="55" width="150" height="62" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
    <text x="509" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#633806">约束求解</text>
    <text x="509" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">预算 · 热量 · 忌口 · 券</text>
  </g>

  <line x1="589" y1="86" x2="632" y2="86" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>

  <g>
    <rect x="636" y="55" width="150" height="62" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.8"/>
    <text x="711" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#27500A">多目标打分</text>
    <text x="711" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">帕累托去重 · Top-K</text>
  </g>

  <g>
    <rect x="232" y="160" width="554" height="62" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
    <text x="509" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">输出：可解释方案 + 可直接下单的 order_items</text>
    <text x="509" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">productCode / quantity / 券后总价 / 营养达成度</text>
  </g>

  <path d="M711 117 L711 138 L509 138 L509 158" fill="none" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" role="img">
  <title>麦麦点餐参谋 架构</title>
  <desc>菜单快照与券快照两条输入，各自经过归一化，进入约束求解与券包体检，输出可直接下单的方案与券的净价值报告。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="420" rx="16" fill="#ffffff" stroke="#e3e3e3"/>
  <text x="640" y="44" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="20" font-weight="700" fill="#0C447C">两条输入，各走一条链路，共用同一个约束求解器</text>

  <!-- 输入 A -->
  <rect x="40" y="82" width="210" height="86" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <text x="145" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#0C447C">菜单快照</text>
  <text x="145" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5">query-meals</text>
  <text x="145" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5">list-nutrition-foods</text>

  <!-- 输入 B -->
  <rect x="40" y="252" width="210" height="86" rx="8" fill="#FDF3E7" stroke="#EF9F27" stroke-width="0.8"/>
  <text x="145" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#633806">券快照</text>
  <text x="145" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">query-store-coupons</text>
  <text x="145" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">calculate-price（实测价值）</text>

  <line x1="255" y1="125" x2="318" y2="125" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="255" y1="295" x2="318" y2="295" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 归一化 A -->
  <rect x="322" y="82" width="200" height="86" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="422" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#3C3489">归一化索引</text>
  <text x="422" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7">名称对齐 · 角色分类</text>
  <text x="422" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7">套餐营养建模</text>

  <!-- 归一化 B -->
  <rect x="322" y="252" width="200" height="86" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
  <text x="422" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#3C3489">券的价值口径</text>
  <text x="422" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7">实测 &gt; 菜单反查 &gt; 未知</text>
  <text x="422" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7">分 → 元只在这里换算一次</text>

  <line x1="527" y1="125" x2="590" y2="125" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="527" y1="295" x2="590" y2="295" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 核心 A -->
  <rect x="594" y="82" width="200" height="86" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
  <text x="694" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#633806">约束求解</text>
  <text x="694" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">预算 · 热量 · 蛋白 · 忌口</text>
  <text x="694" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">硬约束过滤 → 打分 → Top-K</text>

  <!-- 核心 B -->
  <rect x="594" y="252" width="200" height="86" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
  <text x="694" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#633806">券包体检 + 排程</text>
  <text x="694" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">净价值四分类</text>
  <text x="694" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B">机会约束下的用券分配</text>

  <line x1="799" y1="125" x2="862" y2="125" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="799" y1="295" x2="862" y2="295" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 输出 A -->
  <rect x="866" y="82" width="374" height="86" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.8"/>
  <text x="1053" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#27500A">可解释方案 + 可直接下单</text>
  <text x="1053" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3B6D11">productCode / quantity / 券后总价 / 营养达成度</text>
  <text x="1053" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3B6D11">「这一单你多花了多少钱」也在这里算出来</text>

  <!-- 输出 B -->
  <rect x="866" y="252" width="374" height="86" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text x="1053" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#085041">券的净价值 + 用券排程</text>
  <text x="1053" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56">哪几张该用、哪几张该劝退、哪几张注定浪费</text>
  <text x="1053" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56">把"券"从可用资源还原成有保质期的钱</text>

  <!-- 衔接：基准消费 -->
  <path d="M694 172 L694 210 L1053 210 L1053 248" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="873" y="202" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8a5a00">方案的券后总价 → 作为券包体检的基准消费</text>

  <text x="640" y="398" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="12" fill="#8a8a8a">零第三方依赖 · 不需要 MCP Token 即可复现（读仓库内置真实快照）</text>
</svg>
